<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cronología interactiva del caso Yahoo en Game World - Proyecto educativo sobre protección de datos personales.">
    <meta name="author" content="Equipo Game World">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <title>Game World | Caso Yahoo!</title>

    <!-- Hojas de estilo modulares (respetando el orden de cascada) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/yahoo-game.css">
</head>
<body>

    <!-- Header inyectado automáticamente mediante JS -->
    <div id="header-container"></div>

    <!-- Contenido Principal de la Cronología Interactiva -->
    <main class="yahoo-container">
        <header class="game-header">
            <h1>Caso Yahoo!: La Cronología de una Brecha</h1>
            <p>Avanzá por la línea de tiempo cumpliendo las acciones de cada hito para entender la caída de un gigante.</p>
        </header>

        <!-- Cápsula 3D de Línea de Tiempo (Ancho completo con barra de progreso) -->
        <div class="timeline-capsule-wrapper">
            <nav class="timeline-capsule" id="timeline-capsule" aria-label="Cronología del caso Yahoo de 2010 a 2026">
                <div class="timeline-fill" id="timeline-fill"></div>
                <button class="step-btn active" data-step="2010" data-index="0">2010</button>
                <button class="step-btn" data-step="2012" data-index="1">2012</button>
                <button class="step-btn" data-step="2013" data-index="2">2013</button>
                <button class="step-btn" data-step="2014" data-index="3">2014</button>
                <button class="step-btn" data-step="2016" data-index="4">2016</button>
                <button class="step-btn" data-step="2017" data-index="5">2017</button>
                <button class="step-btn" data-step="2018" data-index="6">2018</button>
                <button class="step-btn" data-step="2019" data-index="7">2019</button>
                <button class="step-btn" data-step="2026" data-index="8">2026</button>
            </nav>
        </div>

        <!-- Tablero de Juego / Escenario Interactivo (Izquierda vs Derecha) -->
        <section class="versus-stage" id="game-stage" aria-label="Escenario interactivo">
            <div class="entity-bubble" id="yahoo-bubble">
                <div class="bubble-inner"><img src="assets/yahoo/yahoo-logo.svg" alt="Logo de Yahoo"></div>
                <p>Yahoo!</p>
            </div>

            <div class="vs-separator" id="stage-action-area">
                <button id="btn-comprar" class="btn btn-primary pulse-btn">🤝 Comprar ($100M)</button>
            </div>

            <div class="entity-bubble" id="ac-bubble">
                <div class="bubble-inner"><img src="assets/yahoo/associated-content.svg" alt="Logo de Associated Content"></div>
                <p>Associated Content</p>
            </div>
        </section>

        <!-- Pantalla Estilo Terminal Retro / Consola de eventos -->
        <section class="retro-tv" aria-label="Consola de eventos del sistema">
            <p id="terminal-text">> [SISTEMA INICIALIZADO] Año 2010: Presioná "Comprar" para fusionar Associated Content con Yahoo...</p>
        </section>

        <!-- Control de Música de Fondo -->
        <div class="audio-control-container" style="text-align: center; margin-top: 15px;">
            <button id="btn-audio" class="btn btn-secondary">🎵 Música: OFF</button>
        </div>
    </main>

    <!-- Footer inyectado automáticamente mediante JS -->
    <div id="footer-container"></div>

    <!-- Scripts: Cargador dinámico de componentes y lógica del juego de Yahoo -->
    <script src="js/include-components.js"></script>
    <script src="js/yahoo-game.js"></script>
</body>
</html>
